# For the report repository: the contents of docs/ are the root of that repository.
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build and deploy the report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Executes the notebooks (tables and figures come from data/). -W: a notebook error or a missing
      # data file fails the build, so a broken report is never published.
      - run: jupyter-book build . --all -W -n --keep-going
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
